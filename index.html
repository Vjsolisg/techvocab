cessary resources","es":"Arreglárselas a duras penas — sobrevivir con lo mínimo, a punto del límite","ex":"After the contract ended, the company was scraping by on emergency maintenance work alone.","note":"More desperate than 'getting by' — implies genuine struggle, not just modesty","ph":"/ˈskreɪpɪŋ baɪ/"},{"id":"ev12","term":"skyscraper","type":"Sustantivo","cat":"everyday","en":"An extremely tall building, typically in an urban environment; a defining feature of modern city skylines","es":"Rascacielos — edificio extremadamente alto, típico del entorno urbano moderno","ex":"The new headquarters is a 45-floor skyscraper in the financial district of Madrid.","note":"Literal compound: 'scrape the sky'. No figurative common use — purely architectural","ph":"/ˈskaɪskreɪpə/"},{"id":"ev13","term":"get by","type":"Phrasal Verb","cat":"everyday","en":"To manage to live, survive, or cope — especially with limited resources or in a difficult situation","es":"Arreglárselas — sobrevivir o manejarse, especialmente con recursos limitados","ex":"With the budget cuts, the maintenance team had to get by with half the usual spare parts stock.","note":"Neutral tone — implies adequacy, not comfort. Less desperate than 'scraping by'","ph":"/ɡet ˈbaɪ/"},{"id":"ev14","term":"immediately clicked","type":"Verb Phrase","cat":"everyday","en":"For digital actions: fine and natural. For social 'clicked' (bonding with someone): use 'immediately clicked' carefully — 'we immediately clicked' sounds slightly unnatural; prefer 'we clicked straight away' or 'we hit it off immediately'","es":"Para acciones digitales: natural. Para conexión social: 'immediately clicked' suena algo forzado; mejor: 'we clicked straight away' o 'we hit it off immediately'","ex":"I clicked the button immediately. / We hit it off immediately — clicked is better without 'quickly/immediately' in social contexts.","note":"Key insight: adverb + 'clicked' works well for technology but sounds unnatural for social bonding","ph":"/ɪˈmiːdiətli klɪkt/"},{"id":"ev15","term":"change clothes / get changed","type":"Verb Phrase","cat":"everyday","en":"to take off the clothes you are wearing and put on different ones","es":"Cambiarse de ropa","ex":"I got home from the plant and changed clothes before dinner.","note":"Se dice 'change clothes' o 'get changed', sin 'the'. Ortografía: clothes /kləʊðz/ (a menudo /kləʊz/), no 'clouths'. 'Change into' + prenda: 'She changed into something comfortable'. Clase 04/11/2026.","ph":"/tʃeɪndʒ kləʊðz/ · /ɡet tʃeɪndʒd/"},{"id":"ev16","term":"get dressed","type":"Verb Phrase","cat":"everyday","en":"to put on your clothes, usually after waking up","es":"Vestirse (acción básica, al levantarse)","ex":"I got dressed and left for the plant at seven.","note":"'Get dressed' = vestirse por primera vez; 'change clothes' = cambiar la ropa que ya llevas. Clase 04/11/2026.","ph":"/ɡet drest/"},{"id":"ev17","term":"hold your own","type":"Idiom","cat":"everyday","en":"to defend yourself or perform well in a difficult situation, competing successfully against stronger or more experienced people","es":"Defenderse bien; no dejarse avasallar; estar a la altura frente a alguien más fuerte o experimentado","ex":"Despite being the youngest engineer, she can hold her own in technical meetings.","note":"El posesivo cambia con el sujeto: hold my/his/their own. Implica no perder, no necesariamente ganar. Distinto de 'stand your ground'. Clase 04/11/2026.","ph":"/həʊld jɔːr ˈəʊn/"},{"id":"ev18","term":"in bulk","type":"Adverbial Phrase","cat":"everyday","en":"in large quantities; (of goods) loose or unpackaged, handled as a whole","es":"Al por mayor (comprar, vender) o a granel (transportar, almacenar)","ex":"We buy ferric sulphate in bulk to reduce the unit price.","note":"Sin artículo: 'in bulk', no 'in the bulk'. Distinto de 'the bulk of' (la mayor parte de) y 'bulky' (voluminoso). Colocaciones: bulk discount, bulk order, bulk storage. Clase 04/11/2026.","ph":"/ɪn ˈbʌlk/"},{"id":"ev19","term":"better off","type":"Adjetivo / Expresión","cat":"everyday","en":"in a better situation (financially or otherwise); used to say what would be more advantageous","es":"En mejor situación; te convendría más (hacer algo)","ex":"You'd be better off replacing the pump than repairing it again.","note":"Patrón útil: 'you'd be better off + -ing'. Comparativo de 'well off'. Clase 04/11/2026.","ph":"/ˌbetər ˈɒf/"},{"id":"ev20","term":"a quiet weekend","type":"Collocation","cat":"everyday","en":"a weekend without special activities or events; relaxed and calm","es":"Un fin de semana tranquilo","ex":"I had a quiet weekend. I just stayed at home and relaxed.","note":"Frase de la clase del 04/11/2026. Se puede ampliar con: 'I just stayed at home and relaxed'.","ph":"/ə ˈkwaɪət ˌwiːkˈend/"},{"id":"ev21","term":"caveat","type":"Sustantivo","cat":"everyday","en":"A warning or condition that must be taken into account before accepting a statement or agreement","es":"Salvedad, advertencia o condición que matiza una afirmación o un acuerdo","ex":"The tender is acceptable, with one caveat: the supplier must guarantee spare parts for ten years.","note":"Muy común en informes y contratos: 'with the caveat that…', 'one important caveat is…'. Plural: caveats.","ph":"/ˈkæviæt/ · /ˈkeɪviæt/"},{"id":"ev22","term":"can't stand it · won't tolerate it","type":"Expresión","cat":"everyday","en":"can't stand: to dislike something so much that you cannot bear it | won't tolerate: to refuse to accept unacceptable behaviour","es":"No soportarlo (rechazo personal) | No pienso tolerarlo (postura firme)","ex":"I can't stand the noise, and I won't tolerate unsafe practices on site.","note":"'I don't tolerate it' es correcto pero frío; mejor 'I won't / can't tolerate it'. Tras 'stand' va sustantivo o -ing: I can't stand waiting. Apóstrofo ' y no ´. Chat 18/11/2026.","ph":"/aɪ kɑːnt stænd ɪt/ · /aɪ wəʊnt ˈtɒləreɪt ɪt/"},{"id":"ev23","term":"can't get a word in edgeways","type":"Idiom","cat":"everyday","en":"to be unable to speak in a conversation because someone else talks all the time","es":"No poder meter baza; no dejar hablar","ex":"Every time I talk to him, I can't get a word in edgeways.","note":"Variante americana: edgewise. Se usa casi siempre en negativa (can't / couldn't). Chat 18/11/2026.","ph":"/aɪ kɑːnt ɡet ə ˈwɜːd ɪn ˈedʒweɪz/"},{"id":"ev24","term":"sideways","type":"Adverbio / Adjetivo","cat":"everyday","en":"toward or from the side; (informal) going wrong","es":"De lado, lateralmente; (coloq.) torcerse, salir mal","ex":"The car slid sideways on the ice. / The project went sideways.","note":"Sufijo -ways (-wise en EE. UU.): edgeways, lengthways, crossways. Técnico: sideways load (carga lateral), sideways displacement. En mercados: 'moved sideways' = sin tendencia. Chat 18/11/2026.","ph":"/ˈsaɪdweɪz/"},{"id":"ev25","term":"on a knife edge","type":"Idiom","cat":"everyday","en":"in a critical situation where the result could go either way","es":"Al filo de la navaja; en la cuerda floja; muy ajustado","ex":"The plant is operating on a knife edge: one more pump failure and we exceed the discharge limit.","note":"Como adjetivo lleva guion: a knife-edge vote. Sinónimo más sencillo: touch and go. La k de knife no se pronuncia. Chat 18/11/2026.","ph":"/ɒn ə ˈnaɪf edʒ/"},{"id":"ev26","term":"you could cut the tension with a knife","type":"Idiom","cat":"everyday","en":"the atmosphere is so tense that it feels almost physical","es":"Se podía cortar el ambiente con un cuchillo","ex":"After the argument, you could cut the tension with a knife.","note":"Forma habitual con 'could' (con 'can' es posible pero menos natural). También con 'atmosphere'. Chat 18/11/2026.","ph":"/juː kʊd kʌt ðə ˈtenʃn wɪð ə naɪf/"},{"id":"ev27","term":"cheat / cheating","type":"Verbo regular","cat":"everyday","en":"to act dishonestly to gain an advantage; (cheat on someone) to be unfaithful","es":"Hacer trampa; engañar; ser infiel (cheat on)","ex":"He was caught cheating in the exam.","note":"cheat at (juego), cheat on (pareja), cheat someone out of (estafar). /tʃiːt/ con 'i' larga, no /tʃɪt/. Técnico: emissions cheating (defeat device). Chat 18/11/2026.","ph":"/tʃiːt/ · /ˈtʃiːtɪŋ/"},{"id":"ev28","term":"to con · conned · conning","type":"Verbo informal","cat":"everyday","en":"to trick someone, usually by first gaining their trust, in order to get money or an advantage","es":"Timar, estafar, engañar para sacar algo","ex":"A fake supplier conned us out of 2,000 euros.","note":"Estructuras: con someone / con someone out of something / con someone into doing. Familia: a con (timo), con man, con artist /ˌkɒn ˈɑːtɪst/, ex-con. Viene de 'confidence'. Registro coloquial; en informe formal: defrauded, misled. Chat 18/11/2026.","ph":"/kɒn/ · /ˈkɒnɪŋ/ · /ˈkɒn ˌɑːtɪst/"},{"id":"ev29","term":"take advantage of","type":"Verb Phrase","cat":"everyday","en":"(1) to make good use of an opportunity | (2) to treat someone unfairly for your own benefit","es":"(1) Aprovechar una oportunidad | (2) Aprovecharse de alguien","ex":"Take advantage of the low demand to do the maintenance.","note":"Con cosa o situación es neutro o positivo; con persona es negativo. Estructura: take advantage of + sustantivo o -ing. Chat 18/11/2026.","ph":"/teɪk ədˈvɑːntɪdʒ əv/"},{"id":"ev30","term":"make the most of","type":"Verb Phrase","cat":"everyday","en":"to use an opportunity or resource as fully as possible","es":"Sacar el máximo partido a","ex":"Let's make the most of the shutdown to inspect the tanks.","note":"Siempre positivo y más enfático que 'take advantage of'. Lleva 'the' antes de 'most'. Chat 18/11/2026.","ph":"/meɪk ðə ˈməʊst əv/"},{"id":"ev31","term":"wing it","type":"Idiom informal","cat":"everyday","en":"to do something without preparation, improvising as you go","es":"Improvisar, sin preparación","ex":"I can't just wing it; I need to prepare the audit.","note":"Origen teatral: actuar 'desde las alas' (wings). Con 'just' suena más natural: I can't just wing it. Chat 18/11/2026.","ph":"/wɪŋ ɪt/"},{"id":"ev32","term":"improvise","type":"Verbo","cat":"everyday","en":"to create or do something on the spot, without preparation, using what is available","es":"Improvisar","ex":"The pump failed, so we had to improvise a temporary bypass.","note":"Neutro y válido en informes. Derivados: improvisation, improvised repair. Se escribe -ise también en inglés americano. Parecido: makeshift (de fortuna). En entorno regulado una solución improvisada puede ser un riesgo. Chat 18/11/2026.","ph":"/ˈɪmprəvaɪz/"},{"id":"ev33","term":"muddle through","type":"Phrasal Verb","cat":"everyday","en":"to manage to get through a difficult situation without a clear method or proper resources","es":"Arreglárselas como se pueda; ir tirando; salir del paso","ex":"We have no spare parts, so we'll have to muddle through until the delivery arrives.","note":"Intransitivo, sin objeto directo. Más desordenado que 'improvise'. /ˈmʌdl/ con la 'u' de cup. Chat 18/11/2026.","ph":"/ˈmʌdl θruː/"},{"id":"ev34","term":"make it up as you go along","type":"Idiom","cat":"everyday","en":"to improvise a plan or action step by step while doing it","es":"Improvisar sobre la marcha; ir inventándolo según se hace","ex":"There was no procedure, so we made it up as we went along.","note":"Variante corta: as you go. Cambia el pronombre y el tiempo (as we went along). Cuidado: sugiere que no hay método ni procedimiento. Chat 18/11/2026.","ph":"/meɪk ɪt ʌp əz juː ɡəʊ əˈlɒŋ/"},{"id":"ev35","term":"feel free to ask questions as I go along","type":"Fórmula de presentación","cat":"everyday","en":"polite formula inviting people to ask questions at any moment during a talk","es":"No dudes en preguntar mientras avanzo","ex":"Feel free to ask any questions as I go along.","note":"feel /fiːl/ no es fell /fel/ (pasado de fall). 'I' siempre en mayúscula. Aquí 'as I go along' = durante el proceso, sin matiz de improvisar. Variante: Feel free to interrupt me. Chat 18/11/2026.","ph":"/fiːl friː tuː ɑːsk/"},{"id":"ev36","term":"skip","type":"Verbo / Sustantivo","cat":"everyday","en":"(1) to omit or miss something | (2) to move with light hops | (3) UK noun: a large open container for waste","es":"Saltarse, omitir; faltar; dar saltitos | (UK) contenedor de obra","ex":"Put the scrap metal in the skip. / Never skip a step in the SOP.","note":"Regular con doble p: skipped, skipping. En EE. UU. el contenedor es 'dumpster'. Expresiones: skip it, skip town, skip over, skip a beat. Chat 18/11/2026.","ph":"/skɪp/"},{"id":"ev37","term":"wheelbarrow","type":"Sustantivo","cat":"everyday","en":"a small hand-propelled cart with one wheel and two handles for carrying loads","es":"Carretilla de mano","ex":"Use the wheelbarrow to carry the sand to the filter.","note":"wheel + barrow; la 'h' no suena. 'Wail' /weɪl/ es otra palabra (gemir). Falso amigo: carretilla elevadora = forklift; también sack truck (carretilla de dos ruedas) y pallet truck (transpaleta). Chat 18/11/2026.","ph":"/ˈwiːlˌbærəʊ/"},{"id":"ev38","term":"plank · board · beam","type":"Sustantivos (madera)","cat":"everyday","en":"plank: a long, flat, thick piece of wood | board: a flat piece of wood, usually thinner | beam: a long, strong structural piece","es":"Tablón | tabla | viga","ex":"Lay a plank across the trench.","note":"Se escribe wood, no 'wook'. wood /wʊd/ se pronuncia igual que would. Madera de construcción: timber (UK) / lumber (US). Chat 18/11/2026.","ph":"/plæŋk/ · /bɔːd/ · /biːm/"},{"id":"ev39","term":"gobsmacked","type":"Adjetivo informal (UK)","cat":"everyday","en":"utterly astonished; so surprised that you cannot speak","es":"Atónito, alucinado","ex":"I was gobsmacked when I saw the bill.","note":"gob (boca) + smacked (golpeado). Sinónimos: flabbergasted, speechless. Se usa con be o feel + by / at / that. Chat 18/11/2026.","ph":"/ˈɡɒbsmækt/"},{"id":"ev40","term":"gob","type":"Sustantivo / Verbo (argot UK)","cat":"everyday","en":"(slang) mouth; a lump of a soft substance; (verb) to spit","es":"Boca (vulgar); pegote, gargajo; escupir","ex":"Put a gob of grease on the shaft before assembly.","note":"'Shut your gob' es vulgar; en neutro: mouth. Derivados: gobby (bocazas), gobstopper. Chat 18/11/2026.","ph":"/ɡɒb/"},{"id":"ev41","term":"shovel · spade · pickaxe · rake · bucket","type":"Sustantivos (herramientas)","cat":"everyday","en":"common hand tools for digging and site work","es":"Pala | pala de punta | pico | rastrillo | cubo","ex":"Pass me the shovel and the bucket.","note":"Herramientas del bloque de la wheelbarrow. Chat 18/11/2026.","ph":"/ˈʃʌvl/ · /speɪd/ · /ˈpɪkæks/ · /reɪk/ · /ˈbʌkɪt/"},{"id":"w01","term":"Effluent","type":"Sustantivo Técn.","cat":"water","en":"treated water discharged to the receiving water body","es":"Efluente — agua tratada descargada al medio receptor","ex":"The effluent from the WWTP met EU discharge standards for BOD and TSS.","ph":"/ˈefluənt/"},{"id":"w02","term":"Influent","type":"Sustantivo Técn.","cat":"water","en":"raw incoming water or wastewater entering treatment","es":"Afluente — agua bruta de entrada al sistema de tratamiento","ex":"Influent BOD was measured at 350 mg/L during peak flow conditions.","ph":"/ˈɪnfluənt/"},{"id":"w03","term":"Coagulation","type":"Proceso","cat":"water","en":"chemical destabilisation of suspended colloidal particles","es":"Coagulación — desestabilización química de partículas coloidales","ex":"Ferric sulphate was applied for coagulation at the WTP at 40 mg/L dose.","ph":"/kəʊˌæɡjuˈleɪʃn/"},{"id":"w04","term":"Flocculation","type":"Proceso","cat":"water","en":"aggregation of destabilised particles into larger settleable flocs","es":"Floculación — agregación de partículas en flóculos sedimentables","ex":"Gentle stirring during flocculation promotes floc growth and settling.","ph":"/ˌflɒkjuˈleɪʃn/"},{"id":"w05","term":"Turbidity","type":"Parámetro","cat":"water","en":"cloudiness of water due to suspended particles, measured in NTU","es":"Turbidez — presencia de partículas en suspensión (en NTU)","ex":"Turbidity was reduced from 45 to 0.3 NTU after rapid sand filtration.","ph":"/tɜːˈbɪdəti/"},{"id":"w06","term":"BOD (Biochem. O₂ Demand)","type":"Parámetro","cat":"water","en":"measure of biodegradable organic pollution in water (mg/L)","es":"DBO — medida de contaminación orgánica biodegradable del agua","ex":"BOD₅ of the raw sewage was 280 mg/L; effluent target was \u003c25 mg/L.","ph":"/ˌbiː əʊ ˈdiː/"},{"id":"w07","term":"COD (Chemical O₂ Demand)","type":"Parámetro","cat":"water","en":"measure of total chemical oxygen demand in water (mg/L)","es":"DQO — demanda química de oxígeno total del agua","ex":"COD removal efficiency reached 92% after secondary biological treatment.","ph":"/ˌsiː əʊ ˈdiː/"},{"id":"w08","term":"Activated sludge","type":"Proceso Biológico","cat":"water","en":"aerobic biological treatment using suspended microbial flocs","es":"Lodos activos — tratamiento biológico aerobio en suspensión","ex":"The activated sludge process operated at an SRT of 15 days.","ph":"/ˌæktɪveɪtɪd ˈslʌdʒ/"},{"id":"w09","term":"Nitrification","type":"Proceso Biológico","cat":"water","en":"biological oxidation of ammonia to nitrate by autotrophic bacteria","es":"Nitrificación — oxidación biológica de amonio a nitrato","ex":"Complete nitrification was achieved at 18°C with adequate dissolved oxygen.","ph":"/ˌnaɪtrɪfɪˈkeɪʃn/"},{"id":"w10","term":"Denitrification","type":"Proceso Biológico","cat":"water","en":"biological reduction of nitrate to N₂ gas under anoxic conditions","es":"Desnitrificación — reducción biológica de nitratos a N₂ en anoxia","ex":"An anoxic zone was designed for denitrification upstream of the aerobic zone.","ph":"/diːˌnaɪtrɪfɪˈkeɪʃn/"},{"id":"w11","term":"MBR (Membrane Bioreactor)","type":"Tecnología","cat":"water","en":"combined biological treatment and membrane filtration system","es":"Biorreactor de membrana — combina biología y filtración por membrana","ex":"The MBR produced effluent suitable for agricultural irrigation water reuse.","ph":"/ˌem biː ˈɑː/"},{"id":"w12","term":"RO (Reverse Osmosis)","type":"Tecnología","cat":"water","en":"high-pressure membrane process for desalination or purification","es":"Ósmosis inversa — separación a alta presión por membrana semipermeable","ex":"RO was applied for desalination of brackish groundwater at the site.","ph":"/ˌɑːr ˈəʊ/ · reverse osmosis /rɪˌvɜːs ɒzˈməʊsɪs/"},{"id":"w13","term":"Water hammer","type":"Hidráulica","cat":"water","en":"pressure surge from sudden flow velocity changes in pipes","es":"Golpe de ariete — sobrepresión por cierre brusco de válvulas","ex":"Water hammer damaged the check valve after an emergency pump shutdown.","ph":"/ˈwɔːtə ˌhæmə/"},{"id":"w14","term":"NPSH","type":"Hidráulica","cat":"water","en":"Net Positive Suction Head — pressure at pump inlet to prevent cavitation","es":"ANPA — altura neta de aspiración positiva (parámetro anti-cavitación)","ex":"Available NPSH must exceed required NPSH by a safety margin of at least 0.5 m.","ph":"/ˌen piː es ˈeɪtʃ/"},{"id":"w15","term":"NRW (Non-Revenue Water)","type":"Indicador Gestión","cat":"water","en":"water lost before reaching customers (leakage + apparent losses)","es":"Agua no facturada — pérdidas reales y aparentes en la red de distribución","ex":"NRW exceeded 35%, triggering a district metered area (DMA) audit.","ph":"/ˌen ɑːr ˈdʌbljuː/"},{"id":"w16","term":"Alkalinity","type":"Parámetro","cat":"water","en":"water's capacity to neutralise acids (buffering capacity, mg/L CaCO₃)","es":"Alcalinidad — capacidad tampón del agua para neutralizar ácidos","ex":"Low alkalinity (\u003c80 mg/L CaCO₃) inhibited nitrification in the bioreactor.","ph":"/ˌælkəˈlɪnəti/"},{"id":"w17","term":"SRT (Sludge Retention Time)","type":"Parámetro","cat":"water","en":"mean cell residence time of biomass in the biological system","es":"TRS — tiempo de retención de lodos; edad del lodo en el sistema","ex":"SRT was set at 20 days to ensure stable and complete nitrification.","ph":"/ˌes ɑː ˈtiː/"},{"id":"w18","term":"Head loss","type":"Hidráulica","cat":"water","en":"energy loss due to friction and fittings in a pipe system (metres)","es":"Pérdida de carga — energía perdida por rozamiento en tuberías","ex":"Head loss across the rapid sand filter was 2.5 m at design flow.","ph":"/ˈhed lɒs/"},{"id":"w19","term":"TSS (Total Suspended Solids)","type":"Parámetro","cat":"water","en":"total concentration of solids in suspension in water (mg/L)","es":"SST — sólidos en suspensión totales del agua en mg/L","ex":"TSS in the effluent must be below 35 mg/L per the discharge permit.","ph":"/ˌtiː es ˈes/"},{"id":"w20","term":"EBPR","type":"Proceso","cat":"water","en":"Enhanced Biological Phosphorus Removal using anaerobic/aerobic cycling","es":"Eliminación biológica de fósforo potenciada — ciclo anaerobio/aerobio","ex":"EBPR achieved effluent P concentrations consistently below 1 mg/L.","ph":"/ˌiː biː piː ˈɑː/"},{"id":"s01","term":"ELV (End-of-Life Vehicle)","type":"Término Legal","cat":"scrapping","en":"vehicle at the end of its operational life requiring managed disposal","es":"VFU — Vehículo al Final de su Vida Útil (Dir. 2000/53/CE)","ex":"Directive 2000/53/EC still governs ELV management until Regulation (EU) 2026/1738 starts to apply in 2028.","ph":"/ˌiː el ˈviː/"},{"id":"s02","term":"Depollution","type":"Proceso","cat":"scrapping","en":"removal of all hazardous materials from a vehicle before dismantling","es":"Descontaminación — extracción de materiales peligrosos del VFU","ex":"Depollution includes draining all fluids, removing batteries and pyrotechnics.","ph":"/ˌdiːpəˈluːʃn/"},{"id":"s03","term":"Certificate of Destruction","type":"Doc. Legal","cat":"scrapping","en":"official document confirming proper ELV end-of-life processing","es":"Certificado de Destrucción — documento oficial de baja del VFU","ex":"The CoD must be issued free of charge to the vehicle's last registered owner.","ph":"/səˈtɪfɪkət əv dɪˈstrʌkʃn/"},{"id":"s04","term":"ASR (Automotive Shredder Residue)","type":"Residuo","cat":"scrapping","en":"non-metallic residue from vehicle shredding (fluff)","es":"Fluff — fracción no metálica residual del fragmentado del vehículo","ex":"ASR contains plastics, foam and glass requiring landfill or thermal treatment.","ph":"/ˌeɪ es ˈɑː/"},{"id":"s05","term":"Catalytic converter","type":"Componente","cat":"scrapping","en":"emission control device with recoverable precious metals (Pt, Pd, Rh)","es":"Catalizador — contiene metales preciosos (Pt, Pd, Rh) recuperables","ex":"Catalytic converters are selectively dismantled before shredding.","ph":"/ˌkætəˈlɪtɪk kənˈvɜːtə/"},{"id":"s06","term":"Refrigerant recovery","type":"Proceso","cat":"scrapping","en":"mandatory extraction of HFCs from vehicle AC before shredding","es":"Recuperación de refrigerantes — extracción obligatoria de HFCs del A/C","ex":"Refrigerant recovery must be performed by a certified technician only.","ph":"/rɪˈfrɪdʒərənt rɪˈkʌvəri/"},{"id":"s07","term":"Pyrotechnic components","type":"Comp. Peligroso","cat":"scrapping","en":"airbags and seatbelt pretensioners requiring safe deactivation","es":"Componentes pirotécnicos — airbags y pretensores a neutralizar","ex":"Pyrotechnic components must be deactivated electrically or physically before shredding.","ph":"/ˌpaɪrəʊˈteknɪk kəmˈpəʊnənts/"},{"id":"s08","term":"REACH Regulation","type":"Marco Legal","cat":"scrapping","en":"EU regulation controlling hazardous chemical substances in products","es":"Reglamento REACH — control de sustancias peligrosas en la UE","ex":"REACH restricts hazardous substances in vehicle components: Pb, Cd, Cr(VI), Hg.","ph":"/riːtʃ/"},{"id":"s09","term":"Selective dismantling","type":"Proceso","cat":"scrapping","en":"manual removal of high-value or hazardous components before shredding","es":"Desmontaje selectivo — extracción manual de componentes de valor","ex":"Selective dismantling of electronics recovers rare earth materials.","ph":"/sɪˈlektɪv dɪsˈmæntlɪŋ/"},{"id":"s10","term":"Hazardous waste","type":"Clasificación","cat":"scrapping","en":"waste requiring specialised management due to its dangerous properties","es":"Residuo peligroso — exige gestión especializada por sus propiedades","ex":"Used engine oil is classified as hazardous waste under EU Directive 2008/98/EC.","ph":"/ˈhæzədəs weɪst/"},{"id":"s11","term":"Reuse / Recycling rate","type":"Indicador KPI","cat":"scrapping","en":"% of vehicle weight reused/recovered (EU target ≥95%, recycling ≥85%)","es":"Tasa de reutilización/reciclaje — objetivo europeo del 95%/85% en peso","ex":"EU ELV Directive requires 95% reuse/recovery and 85% reuse/recycling by weight.","ph":"/ˌriːˈjuːs/ · /riːˈsaɪklɪŋ reɪt/"},{"id":"s12","term":"Ferrous scrap","type":"Material","cat":"scrapping","en":"iron-based metallic fraction recovered from vehicle shredding (~70% wt)","es":"Chatarra férrica — fracción metálica principal del VFU (~70% del peso)","ex":"Ferrous scrap is the primary economic output of ELV shredding operations.","ph":"/ˈferəs skræp/"},{"id":"s13","term":"Non-ferrous metals","type":"Material","cat":"scrapping","en":"aluminium, copper, zinc recovered from ELV dismantling and shredding","es":"Metales no férricos — Al, Cu, Zn recuperados del desguace","ex":"Non-ferrous metals have high economic value and are fully recyclable.","ph":"/ˌnɒn ˈferəs ˈmetlz/"},{"id":"c01","term":"Stakeholder","type":"Sustantivo","cat":"communication","en":"person or entity with an interest in a project or organisation","es":"Parte interesada — actor con interés en un proyecto u organización","ex":"Key stakeholders include local authorities, clients, and environmental regulators.","ph":"/ˈsteɪkhəʊldə/"},{"id":"c02","term":"Procurement","type":"Sustantivo","cat":"communication","en":"process of acquiring goods or services through competitive tendering","es":"Contratación — proceso de obtención de bienes o servicios","ex":"The procurement process must comply with EU public tender rules.","ph":"/prəˈkjʊəmənt/"},{"id":"c03","term":"Tender","type":"Sustantivo","cat":"communication","en":"formal offer to supply goods or services at a stated price","es":"Licitación — propuesta formal con precio para un contrato","ex":"We submitted a tender for the WWTP upgrade project.","ph":"/ˈtendə/"},{"id":"c04","term":"KPI","type":"Acrónimo","cat":"communication","en":"Key Performance Indicator — measurable value demonstrating achievement","es":"Indicador Clave de Rendimiento — métrica de evaluación del desempeño","ex":"Treatment efficiency and energy per m³ are core KPIs for the plant.","ph":"/ˌkeɪ piː ˈaɪ/"},{"id":"c05","term":"Due diligence","type":"Sustantivo","cat":"communication","en":"thorough investigation or audit carried out before a business decision","es":"Diligencia debida — auditoría exhaustiva previa a una decisión clave","ex":"Environmental due diligence was conducted before acquiring the site.","ph":"/ˌdjuː ˈdɪlɪdʒəns/"},{"id":"c06","term":"Compliance","type":"Sustantivo","cat":"communication","en":"conformity with laws, regulations, or contractual requirements","es":"Cumplimiento normativo — conformidad con leyes y requisitos legales","ex":"Regulatory compliance with IED and WFD is non-negotiable for our plant.","ph":"/kəmˈplaɪəns/"},{"id":"c07","term":"Scope of work","type":"Documento","cat":"communication","en":"formal description of all work to be performed under a contract","es":"Alcance del trabajo — descripción detallada del trabajo contratado","ex":"The scope of work clearly defined the contractor's obligations and deliverables.","ph":"/ˈskəʊp əv wɜːk/"},{"id":"c08","term":"Benchmark","type":"Sustantivo","cat":"communication","en":"standard reference point used to measure and compare performance","es":"Referencia comparativa — valor estándar para evaluar el rendimiento","ex":"We benchmarked our energy consumption against EU BREF best practices.","ph":"/ˈbentʃmɑːk/"},{"id":"c09","term":"Deliverable","type":"Gestión Proyectos","cat":"communication","en":"specific tangible output of a project, milestone, or contract","es":"Entregable — resultado tangible y verificable de un proyecto","ex":"The final deliverable was a detailed technical feasibility report.","ph":"/dɪˈlɪvərəbl/"},{"id":"c10","term":"MoU (Memorandum of Understanding)","type":"Acuerdo","cat":"communication","en":"non-binding agreement outlining terms of cooperation between parties","es":"Memorando de Entendimiento — acuerdo marco no vinculante entre partes","ex":"An MoU was signed with the municipality for biogas utilisation from the WWTP.","ph":"/ˌem əʊ ˈjuː/"},{"id":"d01","term":"Technical report","type":"Tipo Documento","cat":"documentation","en":"formal document presenting findings, analysis and recommendations","es":"Informe técnico — documento formal con análisis y conclusiones","ex":"A technical report was submitted to the environmental competent authority.","ph":"/ˈteknɪkl rɪˈpɔːt/"},{"id":"d02","term":"Executive summary","type":"Sección","cat":"documentation","en":"concise overview of a longer document for senior decision-makers","es":"Resumen ejecutivo — síntesis del documento para la alta dirección","ex":"The executive summary highlighted key treatment performance results.","ph":"/ɪɡˌzekjətɪv ˈsʌməri/"},{"id":"d03","term":"Appendix","type":"Sección","cat":"documentation","en":"supplementary material placed at the end of a technical document","es":"Anexo — material complementario al final del informe técnico","ex":"Raw analytical data and calibration certificates were included in the appendix.","ph":"/əˈpendɪks/"},{"id":"d04","term":"P&ID","type":"Plano Técnico","cat":"documentation","en":"Piping & Instrumentation Diagram — shows all process equipment and instruments","es":"Diagrama de tuberías e instrumentación — plano de referencia del proceso","ex":"The P&ID showed all valves, sensors and control loops in the treatment plant.","ph":"/ˌpiː ənd ˌaɪ ˈdiː/"},{"id":"d05","term":"Terms of Reference (ToR)","type":"Documento","cat":"documentation","en":"document defining objectives, scope and responsibilities of a project","es":"Términos de referencia — define objetivos, alcance y responsabilidades","ex":"The ToR was prepared for the environmental impact assessment (EIA).","ph":"/ˌtɜːmz əv ˈrefrəns/"},{"id":"d06","term":"Issued for Construction (IFC)","type":"Estado Doc.","cat":"documentation","en":"final approved drawing or document ready for construction use","es":"Emitido para Construcción — estado final y aprobado de un documento","ex":"All drawings were stamped IFC before civil works commenced on site.","ph":"/ˌaɪ ef ˈsiː/"},{"id":"d07","term":"Specification","type":"Documento","cat":"documentation","en":"detailed technical description of materials, methods and performance requirements","es":"Especificación técnica — descripción detallada de requisitos y materiales","ex":"The equipment specification defined all performance guarantees and warranties.","ph":"/ˌspesɪfɪˈkeɪʃn/"},{"id":"d08","term":"Abstract","type":"Sección","cat":"documentation","en":"brief summary of a scientific paper or technical report (150–300 words)","es":"Resumen / Abstract — síntesis de un artículo o informe científico","ex":"The abstract summarised the main findings of the water quality modelling study.","ph":"/ˈæbstrækt/"},{"id":"m01","term":"Agenda","type":"Sustantivo","cat":"meetings","en":"structured list of items to be discussed during a meeting","es":"Orden del día — lista estructurada de temas de la reunión","ex":"Please review the agenda before tomorrow's technical coordination meeting.","ph":"/əˈdʒendə/"},{"id":"m02","term":"Minutes","type":"Sustantivo","cat":"meetings","en":"official written record of a meeting's proceedings and decisions","es":"Acta de reunión — registro oficial de lo tratado y acordado","ex":"The minutes were circulated to all attendees within 24 hours.","ph":"/ˈmɪnɪts/"},{"id":"m03","term":"Action items","type":"Sustantivo","cat":"meetings","en":"specific tasks assigned to individuals during a meeting with deadlines","es":"Compromisos / tareas — acciones asignadas con responsable y plazo","ex":"The action items included submitting the ELV compliance report by Friday.","ph":"/ˈækʃn ˌaɪtəmz/"},{"id":"m04","term":"Follow-up","type":"Sust./Verbo","cat":"meetings","en":"subsequent action or communication after an initial contact or meeting","es":"Seguimiento — acción posterior a una reunión o contacto inicial","ex":"I will follow up on the permit renewal application next week.","ph":"/ˈfɒləʊ ʌp/"},{"id":"m05","term":"AOB (Any Other Business)","type":"Término Reunión","cat":"meetings","en":"final agenda item for topics not covered elsewhere in the meeting","es":"Ruegos y preguntas — último punto del orden del día","ex":"Under AOB, the team raised the issue of the delayed equipment delivery.","ph":"/ˌeɪ əʊ ˈbiː/"},{"id":"m06","term":"Quorum","type":"Sustantivo","cat":"meetings","en":"minimum number of people required for a meeting to be officially valid","es":"Quórum — número mínimo de asistentes para validez de la reunión","ex":"The meeting could not proceed as there was no quorum present.","ph":"/ˈkwɔːrəm/"},{"id":"m07","term":"Chairperson","type":"Sustantivo","cat":"meetings","en":"person who leads, moderates and facilitates a meeting","es":"Presidente / Moderador — quien dirige y modera la reunión","ex":"As chairperson, she kept the technical discussion on track and on time.","ph":"/ˈtʃeəpɜːsn/"},{"id":"m08","term":"Consensus","type":"Sustantivo","cat":"meetings","en":"general agreement reached among all members of a group","es":"Consenso — acuerdo general entre todos los miembros del grupo","ex":"The team reached consensus on the wastewater treatment technology selection.","ph":"/kənˈsensəs/"},{"id":"m09","term":"Briefing","type":"Sustantivo","cat":"meetings","en":"short informational meeting to update a team or group","es":"Sesión informativa breve — reunión corta de puesta al día","ex":"A daily site briefing was held each morning to track construction progress.","ph":"/ˈbriːfɪŋ/"},{"id":"m10","term":"Conference call","type":"Sustantivo","cat":"meetings","en":"telephone or video meeting connecting participants in different locations","es":"Conferencia / Videollamada — reunión a distancia con múltiples sedes","ex":"We held a conference call with the Barcelona supplier to review the tender.","ph":"/ˈkɒnfərəns kɔːl/"},{"id":"ev42","term":"due to the fact that","type":"Expresión","cat":"everyday","en":"a wordy way of saying 'because'; prefer 'because', 'since' or 'due to' + noun","es":"Debido a que (forma larga; mejor 'because' o 'due to' + sustantivo)","ex":"The pump tripped because the suction level was low.","note":"Ortografía: 'due', no 'do'. 'The pump trip was due to low suction level' también es correcto. Chat 25/11/2026.","ph":"/ðə ˈdjuː tə ðə fækt ðæt/"},{"id":"ev43","term":"remarkable","type":"Adjetivo","cat":"everyday","en":"worth noticing, usually in a positive way","es":"Notable, extraordinario","ex":"The membrane showed a remarkable recovery after cleaning.","note":"Escala de reacción: impressive → remarkable → surprised → taken aback → shocking. Chat 25/11/2026.","ph":"/rɪˈmɑːkəbl/"},{"id":"ev44","term":"shocking","type":"Adjetivo","cat":"everyday","en":"very surprising or upsetting; extremely bad","es":"Chocante, escandaloso","ex":"The condition of the pump was shocking.","note":"Ortografía: shock + ing = shocking (con 'c'). Shocked = cómo te sientes; shocking = lo que lo causa. Técnico: shock chlorination (cloración de choque). Chat 25/11/2026.","ph":"/ˈʃɒkɪŋ/"},{"id":"ev45","term":"impressive","type":"Adjetivo","cat":"everyday","en":"earning admiration because of quality, size or skill","es":"Impresionante","ex":"The new WTP has an impressive removal rate.","note":"Ortografía: doble 's' (impress → impressive). Impressed = cómo te sientes. /ɪmˈpresɪv/ con acento en -PRES-. Chat 25/11/2026.","ph":"/ɪmˈpresɪv/"},{"id":"ev46","term":"surprised / surprising","type":"Adjetivo","cat":"everyday","en":"surprised: feeling something unexpected | surprising: causing that feeling","es":"Sorprendido / sorprendente","ex":"I was surprised by the results; the results were surprising.","note":"Participio en -ed = cómo te sientes; en -ing = lo que lo causa. Chat 25/11/2026.","ph":"/səˈpraɪzd/ · /səˈpraɪzɪŋ/"},{"id":"ev47","term":"taken aback","type":"Expresión (pasiva)","cat":"everyday","en":"so surprised that you cannot react at first","es":"Quedarse atónito, descolocado","ex":"I was taken aback by the price of the new membrane.","note":"Se usa casi siempre en pasiva: be taken aback. Más fuerte que 'surprised'. Chat 25/11/2026.","ph":"/ˌteɪkən əˈbæk/"},{"id":"ev48","term":"stingy","type":"Adjetivo informal","cat":"everyday","en":"unwilling to spend money, even when you can afford it","es":"Tacaño, rácano","ex":"The client was stingy with the maintenance budget.","note":"/ˈstɪndʒi/ con 'g' suave, no 'sting'. Distinto de 'poor' (no tener dinero). Chat 25/11/2026.","ph":"/ˈstɪndʒi/"},{"id":"ev49","term":"poor","type":"Adjetivo","cat":"everyday","en":"(1) having little money | (2) of low quality","es":"Pobre; deficiente, de mala calidad","ex":"The poor results were due to a faulty sensor.","note":"Colectivo: the poor. Con cosas significa 'de baja calidad': poor results, poor quality. Chat 25/11/2026.","ph":"/pɔː/ · /pʊə/"},{"id":"ev50","term":"housekeeping","type":"Sustantivo incontable","cat":"everyday","en":"keeping a place clean and orderly","es":"Orden y limpieza","ex":"Good housekeeping reduces the risk of accidents on site.","note":"Ortografía: house + keeping (no 'hosekeeping'). Muy usado en seguridad industrial. Incontable: sin plural ni 'a'. Chat 25/11/2026.","ph":"/ˈhaʊskiːpɪŋ/"},{"id":"ev51","term":"mattress","type":"Sustantivo","cat":"everyday","en":"the soft pad you sleep on","es":"Colchón","ex":"The hotel mattress was very comfortable.","note":"Doble 't' y doble 's'. /ˈmætrɪs/. Chat 25/11/2026.","ph":"/ˈmætrɪs/"},{"id":"ev52","term":"heavenly","type":"Adjetivo","cat":"everyday","en":"wonderful or delicious, as if from heaven","es":"Celestial, divino","ex":"The coffee at the hotel was heavenly.","note":"Es adjetivo, no adverbio. /ˈhevənli/. Chat 25/11/2026.","ph":"/ˈhevənli/"},{"id":"ev53","term":"pure bliss","type":"Colocación","cat":"everyday","en":"perfect happiness and peace","es":"Pura felicidad","ex":"After the audit, a quiet weekend was pure bliss.","note":"Ortografía: bliss, con doble 's'. Incontable. 'i' corta. Chat 25/11/2026.","ph":"/ˌpjʊə ˈblɪs/"},{"id":"ev54","term":"strange","type":"Adjetivo","cat":"everyday","en":"unusual or unexpected, hard to explain","es":"Extraño, raro","ex":"There was a strange noise coming from the centrifuge.","note":"Ortografía: strange, sin 'ex' (no 'extrange'). Falso amigo: strange ≠ extranjero (foreign). Chat 25/11/2026.","ph":"/streɪndʒ/"},{"id":"ev55","term":"nerd","type":"Sustantivo informal","cat":"everyday","en":"someone passionate about technical or academic subjects","es":"Friki, cerebrito","ex":"He is a bit of a nerd about chlorine kinetics.","note":"Parecido a 'geek', que suele sugerir una afición (tecnología, juegos). Pronunciación /nɜːd/. Chat 25/11/2026.","ph":"/nɜːd/"},{"id":"ev56","term":"scammer · scam","type":"Sustantivo / Verbo","cat":"everyday","en":"a person who tricks others to get money or data; the trick itself","es":"Estafador; estafa","ex":"Be careful: this email looks like a scam.","note":"To scam someone out of 500 euros = estafarle 500 euros. Formal: fraudster. Relacionado: con artist, phishing, pig butchering. Chat 25/11/2026.","ph":"/ˈskæmə/ · /skæm/"},{"id":"ev57","term":"Christmas market","type":"Colocación","cat":"everyday","en":"an outdoor holiday market with craft, food and drink stalls","es":"Mercadillo de Navidad","ex":"We went to the Christmas market and had mulled wine.","note":"Ortografía: la 't' no se pronuncia: /ˈkrɪsməs/. Vocabulario: stall, mulled wine, roasted chestnuts, ornaments, fairy lights. Chat 20/11/2026.","ph":"/ˈkrɪsməs ˈmɑːkɪt/"},{"id":"ev58","term":"in depth / in-depth","type":"Adverbio / Adjetivo","cat":"everyday","en":"thoroughly (after a verb); thorough (before a noun)","es":"En profundidad / exhaustivo","ex":"We reviewed the OPEX report in depth. It was an in-depth review.","note":"'In depth' sin guion detrás del verbo; 'in-depth' con guion antes del sustantivo. No se dice 'on depth' (calco de 'en profundidad'). Chat 20/11/2026.","ph":"/ɪn ˈdepθ/"},{"id":"ev59","term":"comfortably off","type":"Adjetivo","cat":"everyday","en":"having enough money to live well without being rich","es":"Con una situación económica holgada","ex":"They are not rich, but they are comfortably off.","note":"Escala: get by \u003c comfortably off / well off \u003c rich \u003c wealthy. Alternativas: financially comfortable, well-to-do, do well for yourself. Chat 22/11/2026.","ph":"/ˈkʌmftəbli ɒf/"},{"id":"gr04","term":"SINCE vs FOR","type":"Grammar Rule","cat":"grammar","en":"Use 'since' with a point in time and 'for' with a duration, usually with the present perfect","es":"'Since' con un punto de inicio en el tiempo; 'for' con una duración. Normalmente con present perfect","ex":"The digester has been running since March / for eight months without a major stoppage.","rule":"✓ since + 2019 / Monday / the upgrade | ✓ for + three years / two weeks | ✗ NOT 'since three years'","confusionWith":"AGO (past simple: 'three years ago')","ph":"/sɪns/ · /fɔː/"},{"id":"gr05","term":"Present perfect vs Past simple","type":"Grammar Rule","cat":"grammar","en":"Present perfect links a past action to now (no finished time stated); past simple refers to a finished, specified time","es":"El present perfect conecta el pasado con el presente (sin tiempo terminado); el past simple se usa con un momento pasado concreto y cerrado","ex":"We have reduced energy consumption by 12% this year. We replaced the blowers in 2024.","rule":"✓ have + participle: this year, so far, already, yet | ✓ past simple: yesterday, in 2024, last month | ✗ NOT 'We have replaced them in 2024'","confusionWith":"Spanish pretérito perfecto ('hemos cambiado ayer')","ph":"/ˌpreznt ˈpɜːfɪkt/"},{"id":"gr06","term":"Uncountable nouns: equipment, sludge, information","type":"Grammar Rule","cat":"grammar","en":"Many technical nouns are uncountable in English: no plural -s and no 'a/an'; use 'a piece of', 'an item of', 'some' or a unit","es":"Muchos sustantivos técnicos son incontables en inglés: sin plural en -s ni 'a/an'; se usa 'a piece of', 'an item of', 'some' o una unidad","ex":"The contractor delivered the equipment on Monday, but we still need more information about sludge disposal.","rule":"✓ equipment, information, advice, sludge, waste, feedback, research | ✓ two items of equipment, 30 tonnes of sludge | ✗ NOT 'equipments', 'informations', 'an advice'","note":"'Data' takes either singular or plural verb in technical English: 'the data is/are'.","ph":"/ʌnˈkaʊntəbl naʊnz/"},{"id":"gr07","term":"AFFECT vs EFFECT","type":"Grammar Rule","cat":"grammar","en":"'Affect' is normally a verb (to influence); 'effect' is normally a noun (the result). 'To effect' as a verb means to bring about","es":"'Affect' suele ser verbo (influir/afectar); 'effect' suele ser sustantivo (efecto/resultado). 'To effect' como verbo significa llevar a cabo","ex":"Low temperatures affect nitrification; the effect is a rise in effluent ammonia.","rule":"✓ X affects Y | ✓ X has an effect on Y | ✓ to effect a change (formal) | ✗ NOT 'has an affect on'","confusionWith":"EFFECT (noun)","ph":"/əˈfekt/ · /ɪˈfekt/"},{"id":"gr08","term":"Passive voice in technical writing","type":"Grammar Rule","cat":"grammar","en":"Use the passive (be + past participle) when the action or result matters more than who did it, e.g. in methods and reports","es":"Se usa la pasiva (be + participio) cuando importa la acción o el resultado más que quién la realiza, p. ej. en métodos e informes","ex":"Samples were collected every two hours and analysed for COD and ammonium.","rule":"✓ Methods, procedures, results | ✓ add 'by + agent' only if relevant | ✗ Avoid long chains of passives in emails: prefer 'we' for actions and commitments","ph":"/ˈpæsɪv vɔɪs/"},{"id":"d09","term":"Method statement","type":"Documento","cat":"documentation","en":"document describing step by step how a specific task will be carried out safely, with resources, hazards and controls","es":"Procedimiento de trabajo — documento que describe paso a paso cómo se ejecutará una tarea de forma segura, con medios, riesgos y medidas de control","ex":"The contractor must submit a method statement before entering the digester for cleaning.","ph":"/ˈmeθəd ˌsteɪtmənt/"},{"id":"d10","term":"As-built drawings","type":"Plano Técnico","cat":"documentation","en":"final drawings showing the installation exactly as it was constructed, including changes made on site","es":"Planos as-built / de obra ejecutada — reflejan la instalación tal como se construyó, con los cambios hechos en obra","ex":"Handover will not be accepted until the as-built drawings of the new pumping station are delivered.","ph":"/ˌæz ˈbɪlt ˈdrɔːɪŋz/"},{"id":"d11","term":"O&M manual","type":"Documento","cat":"documentation","en":"Operation and Maintenance manual: instructions for operating, maintaining and troubleshooting a plant or equipment","es":"Manual de operación y mantenimiento (O&M) — instrucciones para operar, mantener y resolver averías de una planta o equipo","ex":"Check the O&M manual for the recommended backwash frequency of the sand filters.","ph":"/ˌəʊ ən ˈem ˈmænjuəl/"},{"id":"d12","term":"Datasheet","type":"Documento","cat":"documentation","en":"document summarising the technical characteristics and performance of a product or component","es":"Hoja de datos / ficha técnica — resume las características técnicas y prestaciones de un producto o componente","ex":"Please attach the datasheet of the proposed blower, including power consumption at the duty point.","ph":"/ˈdeɪtəʃiːt/"},{"id":"s14","term":"Shredder","type":"Tecnología","cat":"scrapping","en":"large machine that tears depolluted vehicle hulks and scrap into small fragments so that metals can be separated","es":"Fragmentadora (shredder) — máquina que tritura carrocerías descontaminadas y chatarra para separar los metales","ex":"Depolluted hulks are compacted and sent to the shredder, where ferrous metals are recovered magnetically.","ph":"/ˈʃredə/"},{"id":"s15","term":"Hulk (vehicle hulk)","type":"Residuo","cat":"scrapping","en":"the remaining body shell of a vehicle after depollution and removal of reusable parts","es":"Carrocería / casco del vehículo — lo que queda tras la descontaminación y el desmontaje de piezas","ex":"We compacted forty hulks this week before shipping them to the shredding plant.","ph":"/hʌlk/"},{"id":"s16","term":"Traction battery","type":"Comp. Peligroso","cat":"scrapping","en":"high-voltage battery that powers an electric or hybrid vehicle; it must be isolated and removed by trained staff","es":"Batería de tracción — batería de alta tensión de vehículos eléctricos o híbridos; debe aislarse y extraerse por personal formado","ex":"Before dismantling the hybrid, the technician checked that the traction battery was isolated and wore insulated gloves.","ph":"/ˈtrækʃn ˈbætri/"},{"id":"s17","term":"Used spare parts (reuse)","type":"Sustantivo","cat":"scrapping","en":"components removed from end-of-life vehicles, checked and sold for reuse in other vehicles","es":"Piezas de segunda mano / recuperadas — componentes extraídos de VFU, revisados y vendidos para su reutilización","ex":"Sales of used spare parts such as alternators and headlamps now cover a large share of the yard's revenue.","ph":"/juːzd ˈspeə pɑːts/"},{"id":"s18","term":"Extended Producer Responsibility (EPR)","type":"Marco Legal","cat":"scrapping","en":"policy principle that makes producers financially and organisationally responsible for their products when they become waste","es":"Responsabilidad ampliada del productor (RAP) — obliga a los productores a responsabilizarse, financiera y organizativamente, de sus productos cuando se convierten en residuo","ex":"Under Regulation (EU) 2026/1738, vehicle producers will finance the take-back and treatment of end-of-life vehicles through EPR.","ph":"/ɪkˈstendɪd prəˈdjuːsə rɪˌspɒnsəˈbɪləti/"},{"id":"w21","term":"Sludge dewatering","type":"Proceso","cat":"water","en":"reduction of the water content of sludge by mechanical means (centrifuge, belt or screw press) to cut its volume","es":"Deshidratación de fangos — reducción del contenido de agua del fango por medios mecánicos (centrífuga, filtro banda o tornillo) para reducir su volumen","ex":"After upgrading the centrifuge, sludge dewatering reached 24% dry solids and transport costs fell.","ph":"/slʌdʒ diːˈwɔːtərɪŋ/"},{"id":"w22","term":"Anaerobic digestion","type":"Proceso Biológico","cat":"water","en":"biological breakdown of organic matter without oxygen, producing biogas (mainly methane and CO₂) and stabilised sludge","es":"Digestión anaerobia — degradación biológica de la materia orgánica sin oxígeno que produce biogás (principalmente metano y CO₂) y fango estabilizado","ex":"Anaerobic digestion at the WWTP produces enough biogas to cover a large part of the plant's electricity demand.","ph":"/ˌænəˈrəʊbɪk daɪˈdʒestʃən/"},{"id":"w23","term":"CHP (Combined Heat and Power)","type":"Tecnología","cat":"water","en":"cogeneration: simultaneous production of electricity and useful heat from one fuel, such as biogas","es":"Cogeneración — producción simultánea de electricidad y calor útil a partir de un combustible, como el biogás","ex":"Heat recovered from the CHP engine keeps the digesters at mesophilic temperature.","ph":"/ˌsiː eɪtʃ ˈpiː/"},{"id":"w24","term":"Quaternary treatment","type":"Proceso","cat":"water","en":"advanced treatment stage that removes a broad range of micropollutants (e.g. pharmaceuticals) from urban wastewater, typically by ozonation or activated carbon","es":"Tratamiento cuaternario — etapa avanzada que elimina un amplio espectro de microcontaminantes (p. ej. fármacos) de las aguas residuales urbanas, normalmente mediante ozono o carbón activo","ex":"Directive (EU) 2024/3019 requires quaternary treatment in plants of 150,000 p.e. and above, phased in up to 2045.","ph":"/kwəˈtɜːnəri ˈtriːtmənt/"},{"id":"w25","term":"Energy neutrality","type":"Indicador Gestión","cat":"water","en":"situation in which the renewable energy produced (on or off site) equals the total annual energy used by the treatment plants","es":"Neutralidad energética — la energía renovable producida (in situ o fuera) iguala el consumo energético anual total de las depuradoras","ex":"The recast Urban Wastewater Treatment Directive sets a national energy neutrality target for plants of 10,000 p.e. and above by 2045.","ph":"/ˈenədʒi njuːˈtræləti/"},{"id":"w26","term":"Chlorine residual","type":"Parámetro","cat":"water","en":"concentration of chlorine remaining in treated water after the contact time, which protects it in the distribution network","es":"Cloro residual — concentración de cloro que queda en el agua tratada tras el tiempo de contacto y la protege en la red de distribución","ex":"Free chlorine residual at the end of the network dropped, so we increased the dose at the reservoir outlet.","ph":"/ˈklɔːriːn rɪˈzɪdjuəl/"}],"changelog":[{"version":"2026.11.25.2","date":"2026-11-25","notes":"+20 términos de la tarea semanal: gramática (since/for, present perfect, incontables, affect/effect, pasiva), documentación (method statement, as-built, O&M manual, datasheet), VFU (shredder, hulk, batería de tracción, piezas reutilizadas, RAP/EPR) y aguas/energía (deshidratación de fangos, digestión anaerobia, CHP, tratamiento cuaternario, neutralidad energética, cloro residual). Corregidos los ejemplos de «kick in» (pv_in05) y «ELV» (s01): el Reglamento (UE) 2026/1738 deroga la Directiva 2000/53/CE y se aplica desde septiembre de 2028. Total 325."},{"version":"2026.11.25","date":"2026-11-25","notes":"+18 términos (reacciones: remarkable, shocking, impressive, taken aback; stingy, nerd, scammer, Christmas market, in depth, comfortably off…). Total 305, con fonética IPA en todos."},{"version":"2026.11.19","date":"2026-11-19","notes":"+24 términos (burst/brush/bush, expresiones de improvisar, knife edge, con, gobsmacked, wheelbarrow, caveat…) y nota ampliada en \"figure out\". Total 287, con fonética IPA en todos."},{"version":"2026.11.05","date":"2026-11-05","notes":"Primera versión de la app: 263 términos importados de TechVocab Pro, con fonética IPA en todos."}]}</script>
<script>
"use strict";
/* ===================== Storage helpers ===================== */
const LS={
  get(k,d){try{const v=localStorage.getItem("tvp:"+k);return v==null?d:JSON.parse(v);}catch(e){return d;}},
  set(k,v){try{localStorage.setItem("tvp:"+k,JSON.stringify(v));return true;}catch(e){return false;}}
};
const DATA_URL_DEFAULT="vocab.json";
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $=s=>document.querySelector(s);
function cmpVer(a,b){const x=String(a).split(/[.\-]/).map(Number),y=String(b).split(/[.\-]/).map(Number);for(let i=0;i<Math.max(x.length,y.length);i++){const d=(x[i]||0)-(y[i]||0);if(d)return d;}return 0;}
function shuffle(a){const r=[...a];for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function valid(d){return d&&d.version&&d.CATS&&Array.isArray(d.V)&&d.V.length>0&&d.V.every(v=>v.id&&v.term&&v.cat&&v.es);}

/* ===================== Data ===================== */
const SEED=JSON.parse(document.getElementById("seed").textContent);
let D=(()=>{const c=LS.get("data",null);return valid(c)&&cmpVer(c.version,SEED.version)>=0?c:SEED;})();
const P={ // progress
  mastered:new Set(LS.get("mastered",[])),
  stats:LS.get("stats",{}) // id -> [correct, wrong]
};
function saveP(){LS.set("mastered",[...P.mastered]);LS.set("stats",P.stats);}
const prefs=LS.get("prefs",{});
const S={
  screen:"home",
  selCats:new Set(prefs.cats||Object.keys(D.CATS)),
  selPreps:new Set(prefs.preps||Object.keys(D.PREPS)),
  selConn:new Set(prefs.conn||Object.keys(D.CONN_CATS)),
  onlyPending:!!prefs.onlyPending,
  quizDir:prefs.quizDir||"en-es",
  deck:[],fc:0,flipped:false,
  quiz:null,
  q:"",
  upd:{status:"idle",remote:null,diff:null,msg:""},
  dataUrl:LS.get("dataUrl",DATA_URL_DEFAULT),
  lastCheck:LS.get("lastCheck",null)
};
function sanitizeSel(){
  for(const [set,src] of [[S.selCats,D.CATS],[S.selPreps,D.PREPS],[S.selConn,D.CONN_CATS]]){
    for(const k of [...set]) if(!src[k]) set.delete(k);
    if(!set.size) Object.keys(src).forEach(k=>set.add(k));
  }
}
sanitizeSel();
function savePrefs(){LS.set("prefs",{cats:[...S.selCats],preps:[...S.selPreps],conn:[...S.selConn],onlyPending:S.onlyPending,quizDir:S.quizDir});}

function inFilters(v){
  if(!S.selCats.has(v.cat))return false;
  if(v.cat==="phrasal"&&v.prep&&!S.selPreps.has(v.prep))return false;
  if(v.cat==="connectors"&&v.connCat&&!S.selConn.has(v.connCat))return false;
  return true;
}
function pool(){return D.V.filter(v=>inFilters(v)&&(!S.onlyPending||!P.mastered.has(v.id)));}
function weakPool(){return D.V.filter(v=>{const s=P.stats[v.id];return s&&s[1]>0&&s[1]>=s[0]&&!P.mastered.has(v.id);});}
const cat=v=>D.CATS[v.cat]||{label:v.cat,color:"#94A3B8",icon:"•"};

/* ===================== UI bits ===================== */
const bdg=(c,txt)=>`<span class="bdg" style="color:${c};border-color:${c}55;background:${c}1A">${txt}</span>`;
function meter(reg){const r=D.REGISTERS[reg];if(!r)return"";const lv={formal:4,diplomatic:3,neutral:2,conversational:1}[reg]||0;
  return `<span class="meter">${[1,2,3,4].map(i=>`<i style="background:${i<=lv?r.color:"var(--border)"}"></i>`).join("")}<span style="font-size:11px;color:${r.color};letter-spacing:1px">${esc(r.label)}</span></span>`;}
let toastT;
function toast(t){const el=$("#toast");el.textContent=t;el.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>el.hidden=true,2600);}
function topBar(right){
  const pend=S.upd.status==="available";
  return `<div class="top">
    <div class="brand" data-a="home" role="button" tabindex="0">TECHVOCAB PRO</div>
    ${right||""}
    <button class="ibtn" data-a="list" aria-label="Buscar términos">⌕</button>
    <button class="ibtn" data-a="update" aria-label="Actualizaciones">⟳${pend?'<span class="dot"></span>':""}</button>
  </div>`;
}

/* ===================== Speech ===================== */
let voice=null;
function pickVoice(){try{const vs=speechSynthesis.getVoices();voice=vs.find(v=>/en[-_]GB/i.test(v.lang))||vs.find(v=>/^en/i.test(v.lang))||null;}catch(e){}}
try{if("speechSynthesis" in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}}catch(e){}
function speak(text){
  try{const t=String(text).replace(/\s*\/\s*/g,", ").replace(/\.\.\./g," ");const u=new SpeechSynthesisUtterance(t);u.lang="en-GB";if(voice)u.voice=voice;u.rate=.9;speechSynthesis.cancel();speechSynthesis.speak(u);}
  catch(e){toast("La lectura en voz alta no está disponible en este navegador");}
}
const canSpeak=(()=>{try{return "speechSynthesis" in window;}catch(e){return false;}})();

/* ===================== Screens ===================== */
function renderHome(){
  const p=pool();
  const weak=weakPool();
  const cnt=k=>D.V.filter(v=>v.cat===k&&(k!=="phrasal"||!v.prep||S.selPreps.has(v.prep))&&(k!=="connectors"||!v.connCat||S.selConn.has(v.connCat))).length;
  const tiles=Object.entries(D.CATS).map(([k,c])=>{const on=S.selCats.has(k);
    return `<div class="tile panel" role="button" tabindex="0" aria-pressed="${on}" data-a="cat" data-k="${k}" style="border-color:${on?c.color+"66":"var(--border)"};background:${on?c.color+"12":"var(--surface)"}">
      <div class="ic" style="color:${c.color}">${esc(c.icon)}</div>
      <div class="nm" style="color:${on?"var(--text)":"var(--muted)"}">${esc(c.label)}</div>
      <div class="ct">${cnt(k)} términos</div></div>`;}).join("");
  const preps=S.selCats.has("phrasal")?`<div class="panel sub" style="border-color:${"#C084FC"}33">
      <div class="label" style="color:var(--purple)">⇄ Phrasal verbs · preposición</div>
      <div class="chips">${Object.entries(D.PREPS).map(([k,pp])=>{const on=S.selPreps.has(k);const n=D.V.filter(v=>v.cat==="phrasal"&&v.prep===k).length;
        return `<button class="chip" data-a="prep" data-k="${k}" aria-pressed="${on}" style="color:${on?pp.color:"var(--muted)"};border-color:${on?pp.color+"77":"var(--border)"};background:${on?pp.color+"18":"transparent"}">${k} <span style="opacity:.6">${n}</span></button>`;}).join("")}</div></div>`:"";
  const conns=S.selCats.has("connectors")?`<div class="panel sub" style="border-color:#34D39933">
      <div class="label" style="color:#34D399">↔ Connectors · categoría</div>
      <div class="chips">${Object.entries(D.CONN_CATS).map(([k,r])=>{const on=S.selConn.has(k);const n=D.V.filter(v=>v.cat==="connectors"&&v.connCat===k).length;
        return `<button class="chip" data-a="conn" data-k="${k}" aria-pressed="${on}" style="color:${on?r.color:"var(--muted)"};border-color:${on?r.color+"77":"var(--border)"};background:${on?r.color+"18":"transparent"}">${esc(r.icon)} ${esc(r.label)} <span style="opacity:.6">${n}</span></button>`;}).join("")}</div></div>`:"";
  return topBar()+`<div class="fade">
    <div class="stat panel">
      <span><b>${p.length}</b> seleccionados</span>
      <span><b>${D.V.length}</b> total</span>
      <span style="color:var(--green)">★ <b style="color:var(--green)">${P.mastered.size}</b> dominadas</span>
      <span>datos v<b>${esc(D.version)}</b></span>
    </div>
    <div class="label">▶ Categorías <span style="float:right;letter-spacing:1px;text-transform:none"><button class="chip" data-a="all" style="color:var(--dim);border-color:var(--border);padding:3px 9px;font-size:11px">Todas</button></span></div>
    <div class="grid">${tiles}</div>
    ${preps}${conns}
    <label class="toggle"><input type="checkbox" id="onlyPending" ${S.onlyPending?"checked":""}> Ocultar las tarjetas ya dominadas</label>
    <div class="modes">
      <button class="mode" data-a="flash" style="border-color:#00BFFF44" ${p.length?"":"disabled"}><div class="ic" style="color:var(--cyan)">▣</div><div class="t" style="color:var(--cyan)">FLASHCARDS</div><div class="d">Tarjetas EN ↔ ES<br>con fonética y audio</div></button>
      <button class="mode" data-a="quiz" style="border-color:#F59E0B44" ${p.length>=4?"":"disabled"}><div class="ic" style="color:var(--amber)">◆</div><div class="t" style="color:var(--amber)">QUIZ</div><div class="d">Opción múltiple<br>${p.length} preguntas</div></button>
      <button class="mode" data-a="weak" style="border-color:#EF444444" ${weak.length>=4?"":"disabled"}><div class="ic" style="color:var(--red)">↺</div><div class="t" style="color:var(--red)">REPASO</div><div class="d">Tus fallos del quiz<br>${weak.length} términos</div></button>
    </div>
    ${p.length<4?'<div class="warn">Selecciona al menos 4 términos para el quiz</div>':""}
  </div>`;
}

function renderFlash(){
  const deck=S.deck;if(!deck.length){S.screen="home";return renderHome();}
  S.fc=Math.max(0,Math.min(S.fc,deck.length-1));
  const v=deck[S.fc],c=cat(v),pp=v.prep&&D.PREPS[v.prep],cc=v.connCat&&D.CONN_CATS[v.connCat],m=P.mastered.has(v.id);
  const st=P.stats[v.id];
  const front=`<div class="face front" style="border-color:${c.color}55">
      <div class="label" style="margin:0">${esc(c.label)}</div>
      ${pp?`<div style="font-family:var(--f-display);font-size:22px;letter-spacing:6px;color:${pp.color}">${v.prep}</div><div style="font-size:12px;color:${pp.color};opacity:.8">${pp.core.map(esc).join(" · ")}</div>`:""}
      ${cc?`<div style="font-size:13px;color:${cc.color};letter-spacing:1px">${esc(cc.icon)} ${esc(cc.label.toUpperCase())}</div>${v.register?meter(v.register):""}`:""}
      ${v.cat==="grammar"?bdg("#F472B6","⊢ GRAMMAR RULE"):""}
      ${v.confusionWith?bdg("#F59E0B","⚠ vs "+esc(v.confusionWith)):""}
      <div class="term" style="color:${c.color}">${esc(v.term)}</div>
      ${v.ph?`<div class="ipa">${esc(v.ph)}</div>`:""}
      ${bdg(c.color,esc(v.type||""))}
      ${canSpeak?`<button class="speak" data-a="speak">🔊 Escuchar</button>`:""}
      ${m?`<div style="color:var(--green);font-size:12px">★ DOMINADA</div>`:""}
      <div class="hint">toca para girar ↻ · desliza ⇆</div>
    </div>`;
  const back=`<div class="face back" style="border-color:#00BFFF33">
      <div class="row" style="justify-content:space-between;margin-bottom:14px">
        <span class="ipa" style="font-size:13px">${esc(v.ph||"")}</span>${bdg(c.color,esc(c.icon)+" "+esc(v.type||""))}
      </div>
      <div class="sec"><div class="k" style="color:var(--cyan)">ENGLISH</div><div class="v">${esc(v.en)}</div></div>
      <div class="sec"><div class="k" style="color:var(--amber)">ESPAÑOL</div><div class="v">${esc(v.es)}</div></div>
      ${v.rule?`<div class="box" style="border-color:#F472B655;color:var(--pink)"><b style="font-size:11px;letter-spacing:1.5px">⊢ REGLA</b><br>${esc(v.rule)}${v.confusionWith?`<div style="color:var(--amber);margin-top:6px">⚠ No confundir con: ${esc(v.confusionWith)}</div>`:""}</div>`:""}
      ${!v.rule&&v.confusionWith?`<div class="box" style="border-color:#F59E0B55;color:var(--amber)">⚠ No confundir con: <b>${esc(v.confusionWith)}</b></div>`:""}
      ${cc?`<div class="box" style="border-color:${cc.color}44"><div class="row" style="justify-content:space-between;margin-bottom:4px"><b style="font-size:11px;letter-spacing:1.5px;color:${cc.color}">${esc(cc.icon)} ${esc(cc.label.toUpperCase())}</b>${v.register?meter(v.register):""}</div><div style="color:${cc.color}">${esc(cc.desc)}</div>${v.structure?`<div style="color:var(--dim);font-style:italic;border-top:1px solid var(--border);margin-top:6px;padding-top:6px"><b style="font-style:normal;font-size:11px;color:${cc.color}">ESTRUCTURA</b> ${esc(v.structure)}</div>`:""}</div>`:""}
      ${pp?`<div class="box" style="border-color:${pp.color}44"><b style="font-size:11px;letter-spacing:1.5px;color:${pp.color}">⇄ LÓGICA · ${v.prep}</b><div style="color:${pp.color};font-style:italic;margin:4px 0 6px">${esc(pp.logic)}</div><div class="chips" style="gap:5px">${pp.core.map(x=>bdg(pp.color,esc(x))).join("")}</div></div>`:""}
      ${v.note?`<div class="box" style="border-color:#C084FC44"><b style="font-size:11px;letter-spacing:1.5px;color:var(--purple)">◎ NOTA</b><div style="color:var(--dim)">${esc(v.note)}</div></div>`:""}
      <div class="k" style="color:var(--purple);font-size:11px;letter-spacing:1.5px;margin-bottom:4px;font-weight:700">EJEMPLO EN CONTEXTO</div>
      <div class="ex" style="border:0;padding:0">"${esc(v.ex)}" ${canSpeak?`<button class="speak" data-a="speakex" style="margin-left:4px;padding:3px 10px;min-height:28px">🔊</button>`:""}</div>
      ${st?`<div style="margin-top:12px;font-size:11px;color:var(--muted)">Quiz: ✓${st[0]} · ✗${st[1]}</div>`:""}
    </div>`;
  return topBar()+`<div class="hdr"><button class="btn" data-a="home" style="border-color:var(--border);color:var(--dim);padding:8px 12px;min-height:38px">← INICIO</button>
      <span><b style="color:var(--cyan)">${S.fc+1}</b> / ${deck.length} ${P.mastered.size?`<span style="color:var(--green);margin-left:8px">★ ${P.mastered.size}</span>`:""}</span></div>
    <div class="bar"><div style="width:${(S.fc+1)/deck.length*100}%;background:var(--cyan)"></div></div>
    <div class="flip" id="flip"><div class="inner${S.flipped?" on":""}" id="inner">${front}${back}</div></div>
    <div class="ctrls">
      <button class="btn" data-a="prev" style="border-color:var(--muted);color:var(--dim)" ${S.fc===0?"disabled":""}>◀ ANT.</button>
      <button class="btn" data-a="flip" style="border-color:var(--cyan);color:var(--cyan)">${S.flipped?"↑ TÉRMINO":"↓ DEF."}</button>
      <button class="btn" data-a="master" style="border-color:${m?"var(--green)":"var(--muted)"};color:${m?"var(--green)":"var(--dim)"}">${m?"★ DOM.":"☆ MARCAR"}</button>
      <button class="btn" data-a="next" style="border-color:var(--muted);color:var(--dim)" ${S.fc===deck.length-1?"disabled":""}>SIG. ▶</button>
    </div>
    <div class="row" style="justify-content:center">
      <button class="btn" data-a="shuffle" style="border-color:var(--muted);color:var(--dim)">⇀ MEZCLAR</button>
      <button class="btn" data-a="quiz" style="border-color:var(--amber);color:var(--amber)" ${pool().length>=4?"":"disabled"}>◆ QUIZ</button>
    </div>`;
}

function buildQ(card,from){
  const dist=shuffle(from.filter(v=>v.id!==card.id&&v.es!==card.es));
  const same=dist.filter(v=>v.cat===card.cat);const pick=[...same,...dist.filter(v=>v.cat!==card.cat)].slice(0,3);
  return{card,opts:shuffle([...pick,card]),sel:null};
}
function startQuiz(list){
  if(list.length<4)return;
  const ref=list.length>=8?list:D.V;
  S.quiz={deck:shuffle(list),i:0,c:0,t:0,ref,wrong:[]};
  S.quiz.cur=buildQ(S.quiz.deck[0],ref);
  S.screen="quiz";
}
function renderQuiz(){
  const Q=S.quiz,{card:v,opts,sel}=Q.cur,c=cat(v),pp=v.prep&&D.PREPS[v.prep],cc=v.connCat&&D.CONN_CATS[v.connCat];
  const enes=S.quizDir==="en-es";
  const qtext=enes?`<div class="term" style="color:${c.color}">${esc(v.term)}</div>${v.ph?`<div class="ipa" style="margin-top:6px">${esc(v.ph)}</div>`:""}`
                  :`<div style="font-size:16px;line-height:1.55;color:var(--text)">${esc(v.es)}</div>`;
  return topBar()+`<div class="hdr"><button class="btn" data-a="home" style="border-color:var(--border);color:var(--dim);padding:8px 12px;min-height:38px">← INICIO</button>
      <span>P. <b style="color:var(--amber)">${Q.i+1}</b> / ${Q.deck.length}</span>
      <span><b style="color:var(--green)">✓${Q.c}</b> · <b style="color:var(--red)">✗${Q.t-Q.c}</b></span></div>
    <div class="bar"><div style="width:${(Q.i+1)/Q.deck.length*100}%;background:var(--amber)"></div></div>
    <div style="text-align:center"><div class="seg" role="group" aria-label="Dirección del quiz">
      <button data-a="dir" data-k="en-es" class="${enes?"on":""}">EN → ES</button><button data-a="dir" data-k="es-en" class="${enes?"":"on"}">ES → EN</button></div></div>
    <div class="panel q fade" style="border-color:${c.color}44">
      <div class="label">${enes?"¿Qué significa?":"¿Cómo se dice en inglés?"}</div>
      ${pp?`<div style="font-family:var(--f-display);font-size:16px;letter-spacing:4px;color:${pp.color};margin-bottom:8px">${v.prep}</div>`:""}
      ${qtext}
      <div class="row" style="justify-content:center;margin-top:12px">${bdg(c.color,esc(c.icon)+" "+esc(c.label))}${canSpeak&&enes?`<button class="speak" data-a="speak">🔊</button>`:""}</div>
    </div>
    <div class="opts">${opts.map((o,i)=>{let cl="";if(sel){if(o.id===v.id)cl="ok";else if(sel===o.id)cl="ko";}
      return `<button class="opt ${cl}" data-a="ans" data-k="${o.id}" ${sel?"disabled":""}><span class="l">${"ABCD"[i]}.</span><span>${esc(enes?o.es:o.term)}</span></button>`;}).join("")}</div>
    ${sel?`<div class="fade"><div class="panel fb" style="border-color:${sel===v.id?"#10B98155":"#EF444455"}">
        ${sel===v.id?`<b style="color:var(--green)">✓ CORRECTO</b>`:`<b style="color:var(--red)">✗ INCORRECTO</b> · correcta: <b style="color:var(--amber)">${esc(enes?v.es:v.term)}</b>`}
        ${v.rule?`<div style="color:var(--pink);margin-top:6px">⊢ ${esc(v.rule)}</div>`:""}
        ${cc?`<div style="color:${cc.color};margin-top:6px">${esc(cc.icon)} ${esc(cc.label)}: ${esc(v.structure||cc.desc)}</div>`:""}
        ${pp?`<div style="color:${pp.color};margin-top:6px">⇄ ${v.prep}: ${esc(pp.logic)}</div>`:""}
        <div style="margin-top:8px;color:var(--dim);font-style:italic">"${esc(v.ex)}"</div></div>
      <div style="text-align:center"><button class="btn" data-a="nextq" style="border-color:var(--amber);color:var(--amber);padding:12px 28px">${Q.i+1>=Q.deck.length?"VER RESULTADOS →":"SIGUIENTE →"}</button></div></div>`:""}`;
}
function renderResults(){
  const Q=S.quiz,pct=Q.t?Math.round(Q.c/Q.t*100):0;
  const r=pct>=90?["EXCELENTE","var(--cyan)"]:pct>=70?["BIEN","var(--green)"]:pct>=50?["APROBADO","var(--amber)"]:["REPASA","var(--red)"];
  return topBar()+`<div class="fade" style="text-align:center;max-width:460px;margin:20px auto 0">
    <div class="label">Resultado · quiz</div>
    <div class="big" style="color:${r[1]}">${pct}<span style="font-size:30px">%</span></div>
    <span class="bdg" style="color:${r[1]};border-color:currentColor;font-size:13px;padding:5px 16px">${r[0]}</span>
    <div class="three">
      <div class="panel"><div class="n" style="color:var(--green)">${Q.c}</div><div class="s">CORRECTAS</div></div>
      <div class="panel"><div class="n" style="color:var(--red)">${Q.t-Q.c}</div><div class="s">INCORRECTAS</div></div>
      <div class="panel"><div class="n" style="color:var(--amber)">${Q.t}</div><div class="s">TOTALES</div></div>
    </div>
    ${Q.wrong.length?`<div class="panel" style="text-align:left;padding:12px 14px;margin-bottom:16px"><div class="label">Para repasar</div>${Q.wrong.map(id=>{const v=D.V.find(x=>x.id===id);return v?`<div style="font-size:13px;margin-bottom:6px"><b>${esc(v.term)}</b> <span style="color:var(--dim)">— ${esc(v.es)}</span></div>`:""}).join("")}</div>`:""}
    <div class="row" style="justify-content:center">
      ${Q.wrong.length>=4?`<button class="btn" data-a="redo" style="border-color:var(--red);color:var(--red)">↺ FALLOS</button>`:""}
      <button class="btn" data-a="quiz" style="border-color:var(--amber);color:var(--amber)">◆ REPETIR</button>
      <button class="btn" data-a="flash" style="border-color:var(--cyan);color:var(--cyan)">▣ FLASHCARDS</button>
    </div></div>`;
}
function norm(s){return String(s).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");}
function renderList(){
  return topBar()+`<div class="fade"><input id="q" class="search" type="search" placeholder="Buscar en inglés o español…" value="${esc(S.q)}" autocomplete="off">
    <div id="results" class="panel">${listItems()}</div></div>`;
}
function listItems(){
  const q=norm(S.q.trim());
  const items=D.V.filter(v=>!q||norm(v.term+" "+v.es+" "+v.en+" "+(v.ex||"")).includes(q)).slice(0,150);
  if(!items.length)return `<div class="li" style="color:var(--muted)">Ningún término coincide con «${esc(S.q)}».</div>`;
  return items.map(v=>{const c=cat(v),m=P.mastered.has(v.id),s=P.stats[v.id];
    return `<div class="li"><span style="color:${c.color};font-size:16px;line-height:1.4">${esc(c.icon)}</span><div class="m">
      <div class="tt" style="color:${c.color}">${esc(v.term)} ${v.ph?`<span class="ipa" style="font-size:12px;font-weight:400">${esc(v.ph)}</span>`:""}</div>
      <div class="es">${esc(v.es)}</div>
      <div class="st">${esc(c.label)}${m?' · <span style="color:var(--green)">★ dominada</span>':""}${s?` · quiz ✓${s[0]} ✗${s[1]}`:""}</div></div>
      <button class="ibtn" data-a="open" data-k="${v.id}" aria-label="Abrir tarjeta">▣</button></div>`;}).join("")+(items.length===150?`<div class="li" style="color:var(--muted)">Mostrando 150 resultados. Escribe más para afinar.</div>`:"");
}
function fmtDate(t){if(!t)return"nunca";try{return new Date(t).toLocaleString("es-ES",{dateStyle:"medium",timeStyle:"short"});}catch(e){return String(t);}}
function renderUpdate(){
  const U=S.upd;
  const cl=(D.changelog||[]).slice(0,5);
  let body="";
  if(U.status==="checking")body=`<div class="msg" style="border-color:var(--border);color:var(--dim)">Buscando actualizaciones…</div>`;
  else if(U.status==="available"){const d=U.diff;
    body=`<div class="msg" style="border-color:#F59E0B66;color:var(--text)"><b style="color:var(--amber)">Nueva versión v${esc(U.remote.version)}</b> (${esc(U.remote.updated||"")})
      ${U.remote.notes?`<div style="color:var(--dim);margin-top:4px">${esc(U.remote.notes)}</div>`:""}
      <div style="margin-top:8px">+${d.added.length} nuevos · ${d.changed.length} modificados · ${d.removed.length} retirados · total ${U.remote.V.length}</div>
      ${d.added.length?`<ul class="newlist">${d.added.slice(0,60).map(v=>`<li><b>${esc(v.term)}</b> — ${esc(v.es)}</li>`).join("")}</ul>`:""}
      <div class="row" style="margin-top:12px"><button class="btn fill" data-a="apply">INSTALAR ACTUALIZACIÓN</button><button class="btn" data-a="dismiss" style="border-color:var(--border);color:var(--dim)">MÁS TARDE</button></div></div>`;}
  else if(U.msg)body=`<div class="msg" style="border-color:${U.status==="error"?"#EF444466":"#10B98166"};color:${U.status==="error"?"var(--red)":"var(--green)"}">${esc(U.msg)}</div>`;
  return topBar()+`<div class="fade">
    <div class="label">Contenido instalado</div>
    <div class="panel" style="padding:14px"><dl class="kv" style="margin:0">
      <dt>Versión</dt><dd>v${esc(D.version)}</dd>
      <dt>Fecha</dt><dd>${esc(D.updated||"—")}</dd>
      <dt>Términos</dt><dd>${D.V.length}</dd>
      <dt>Dominadas</dt><dd>${P.mastered.size}</dd>
      <dt>Última comprobación</dt><dd>${fmtDate(S.lastCheck)}</dd>
    </dl></div>
    <div class="row" style="margin-top:14px"><button class="btn fill" data-a="check" ${U.status==="checking"?"disabled":""}>⟳ BUSCAR ACTUALIZACIONES</button>
      <label class="btn" style="border-color:var(--border);color:var(--dim);display:inline-flex;align-items:center" for="file">IMPORTAR ARCHIVO</label>
      <input id="file" type="file" accept=".json,application/json" hidden></div>
    ${body}
    ${cl.length?`<div class="label" style="margin-top:22px">Novedades</div><div class="panel" style="padding:12px 14px">${cl.map(e=>`<div style="margin-bottom:8px;font-size:13px"><b style="color:var(--cyan)">v${esc(e.version)}</b> <span style="color:var(--muted)">${esc(e.date||"")}</span><div style="color:var(--dim)">${esc(e.notes||"")}</div></div>`).join("")}</div>`:""}
    <details style="margin-top:22px"><summary class="label" style="cursor:pointer;margin:0">Opciones avanzadas</summary>
      <div class="panel" style="padding:14px;margin-top:10px">
        <label for="durl" style="font-size:12px;color:var(--dim)">Dirección del archivo de vocabulario</label>
        <input id="durl" class="search" style="font-size:14px;margin:6px 0 10px" value="${esc(S.dataUrl)}" autocomplete="off" spellcheck="false">
        <div class="row"><button class="btn" data-a="saveurl" style="border-color:var(--cyan);color:var(--cyan)">GUARDAR DIRECCIÓN</button>
        <button class="btn" data-a="resetp" style="border-color:#EF444466;color:var(--red)">${S.confirmReset?"PULSA OTRA VEZ PARA CONFIRMAR":"BORRAR MI PROGRESO"}</button></div>
        <div style="font-size:12px;color:var(--muted);margin-top:10px">Tu progreso (dominadas y aciertos) se guarda solo en este dispositivo y se conserva al actualizar el vocabulario.</div>
      </div></details>
  </div>`;
}

/* ===================== Update logic ===================== */
function diff(oldD,newD){
  const om=new Map(oldD.V.map(v=>[v.id,v])),nm=new Map(newD.V.map(v=>[v.id,v]));
  return{added:newD.V.filter(v=>!om.has(v.id)),changed:newD.V.filter(v=>om.has(v.id)&&JSON.stringify(om.get(v.id))!==JSON.stringify(v)),removed:oldD.V.filter(v=>!nm.has(v.id))};
}
async function check(silent){
  S.upd={status:"checking"};if(!silent)render();
  try{
    const url=S.dataUrl+(S.dataUrl.includes("?")?"&":"?")+"t="+Date.now();
    const r=await fetch(url,{cache:"no-store"});
    if(!r.ok)throw new Error("El servidor respondió "+r.status);
    const nd=await r.json();
    if(!valid(nd))throw new Error("El archivo descargado no tiene el formato esperado");
    S.lastCheck=Date.now();LS.set("lastCheck",S.lastCheck);
    offer(nd,silent);
  }catch(e){
    S.upd={status:silent?"idle":"error",msg:"No se pudo comprobar: "+(e.message||e)+". Revisa la conexión; la app sigue funcionando con el contenido instalado."};
    if(!silent)render();
  }
}
function offer(nd,silent){
  if(cmpVer(nd.version,D.version)>0){S.upd={status:"available",remote:nd,diff:diff(D,nd)};if(silent){render();toast("Hay una actualización del vocabulario (v"+nd.version+")");}else render();}
  else{S.upd={status:"ok",msg:"Ya tienes la última versión (v"+D.version+")."};if(!silent)render();}
}
function apply(){
  const nd=S.upd.remote;if(!nd)return;
  const n=diff(D,nd).added.length;
  D=nd;LS.set("data",nd);sanitizeSel();
  const known=new Set(D.V.map(v=>v.id));for(const id of [...P.mastered])if(!known.has(id))P.mastered.delete(id);saveP();
  S.upd={status:"ok",msg:"Actualizado a v"+nd.version+". "+n+" términos nuevos disponibles."};render();
}

/* ===================== Render & events ===================== */
function render(){
  const app=$("#app");
  const html={home:renderHome,flash:renderFlash,quiz:renderQuiz,results:renderResults,list:renderList,update:renderUpdate}[S.screen]();
  app.innerHTML=html;
  if(S.screen==="flash")bindSwipe();
  if(S.screen==="list"){const q=$("#q");q.addEventListener("input",()=>{S.q=q.value;$("#results").innerHTML=listItems();});}
  if(S.screen==="update"){$("#file").addEventListener("change",importFile);}
  if(S.screen==="home"){$("#onlyPending").addEventListener("change",e=>{S.onlyPending=e.target.checked;savePrefs();render();});}
}
function go(screen){S.screen=screen;S.confirmReset=false;render();window.scrollTo(0,0);}
function startFlash(list){S.deck=list;S.fc=0;S.flipped=false;go("flash");}
function setFlip(on){S.flipped=on;const i=$("#inner");if(i)i.classList.toggle("on",on);const b=document.querySelector('[data-a="flip"]');if(b)b.textContent=on?"↑ TÉRMINO":"↓ DEF.";}
function move(d){const n=S.fc+d;if(n<0||n>=S.deck.length)return;S.fc=n;S.flipped=false;render();}
function toggleIn(set,k){if(set.has(k)&&set.size>1)set.delete(k);else set.add(k);savePrefs();render();}

document.addEventListener("click",e=>{
  const el=e.target.closest("[data-a]");if(!el)return;
  const a=el.dataset.a,k=el.dataset.k;
  switch(a){
    case"home":go("home");break;
    case"list":go("list");setTimeout(()=>{const q=$("#q");if(q&&!("ontouchstart" in window))q.focus();},0);break;
    case"update":go("update");break;
    case"cat":toggleIn(S.selCats,k);break;
